[workspace]
members = [".", "crates/hmi-core", "crates/hmi-format", "crates/hmi-analysis", "crates/hmi-artifact", "crates/hmi-compiler", "crates/hmi-linker"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"

[package]
name = "hmi-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
hmi-core = { path = "crates/hmi-core" }
hmi-format = { path = "crates/hmi-format" }
hmi-analysis = { path = "crates/hmi-analysis" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tempfile = "3"
anstream = "1"
anstyle = "1"
