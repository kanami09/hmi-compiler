[workspace]
members = [
    "crates/hmi-core",
    "crates/hmi-format",
    "crates/hmi-analysis",
    "crates/hmi-artifact",
    "crates/hmi-compiler",
    "crates/hmi-linker",
    "crates/hmi-cli",
    "crates/hmi-media",
    "crates/hmi-parser",
]
default-members = ["crates/hmi-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"

