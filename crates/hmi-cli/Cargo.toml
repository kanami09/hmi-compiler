[package]
name = "hmi-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hmi"
path = "src/main.rs"

[dependencies]
hmi-core = { path = "../hmi-core" }
hmi-page-compiler = { path = "../hmi-compiler" }
hmi-linker = { path = "../hmi-linker" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hmi-artifact = { path = "../hmi-artifact" }
hmi-format = { path = "../hmi-format" }
tempfile = "3"
toml = "1.1"
