[package]
name = "hmi-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hmi-core = { path = "../hmi-core" }
hmi-format = { path = "../hmi-format" }
hmi-artifact = { path = "../hmi-artifact" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "1.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png", "jpeg", "gif"] }
jpeg-encoder = "=0.6.1"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
libloading = "=0.8.9"

[dev-dependencies]
tempfile = "3"
