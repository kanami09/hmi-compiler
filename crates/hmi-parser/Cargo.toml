[package]
name = "hmi-parser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hmi-parse"
path = "src/main.rs"

[dependencies]
hmi-core = { path = "../hmi-core" }
hmi-format = { path = "../hmi-format" }
hmi-artifact = { path = "../hmi-artifact" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

