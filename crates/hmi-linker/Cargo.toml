[package]
name = "hmi-linker"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hmi-link"
path = "src/main.rs"

[dependencies]
hmi-core = { path = "../hmi-core" }
hmi-format = { path = "../hmi-format" }
hmi-analysis = { path = "../hmi-analysis" }
hmi-artifact = { path = "../hmi-artifact" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hmi-page-compiler = { path = "../hmi-compiler" }
tempfile = "3"
jpeg-encoder = "=0.6.1"
